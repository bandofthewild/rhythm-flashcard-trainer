name: Build & Deploy

# Runs on every push to main. Builds index.html from src/, runs both test suites,
# and publishes to GitHub Pages. The built index.html is never committed — it is
# generated here, so it can never go stale or conflict.

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you re-run it by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build index.html from src/
        run: |
          cat src/shell_top.html src/engine.js src/shell_bottom.html > index.html
          echo "built $(wc -c < index.html) bytes, $(wc -l < index.html) lines"

      - name: Syntax check the inline script
        run: |
          python3 - <<'PY'
          s = open('index.html', encoding='utf-8').read()
          start = s.rindex('<script>\n(function(){')
          end   = s.rindex('</script>')
          open('test/_inline.js', 'w', encoding='utf-8').write(s[start + len('<script>\n'):end])
          PY
          cat test/dom-stubs.js test/_inline.js > test/_wrapped.js
          node --check test/_wrapped.js
          echo "syntax OK"

      - name: Rhythm generation suite (3024 tests)
        run: node test/generation.test.js

      - name: DSP suite (tempo / phase / bar-phase)
        run: node test/dsp.test.js

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp rhythm-flashcard-trainer-promo.html _site/ 2>/dev/null || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
